name: Verified investment data freshness
on:
  schedule:
    - cron: '15 0 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node scripts/verified-data-release-audit.mjs && node scripts/verified-data-freshness.mjs
  probe-licensed-alternative:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node scripts/probe-ecb-fx.mjs && node scripts/probe-return-delta.mjs && node --test scripts/sec-nport-return.test.mjs
